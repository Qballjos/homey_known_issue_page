<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | {{ app_name }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              homey: {
                500: '#00B86B',
                600: '#00A35E',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="flex flex-col min-h-full items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-homey-500/10 border border-homey-500/20 text-homey-600 flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-950 tracking-tight">{{ app_name }}</h1>
            <p class="text-xs text-gray-500 mt-1">Staff Administration Portal</p>
        </div>

        <!-- Login Card -->
        <div class="homey-card p-8 sm:p-10 shadow-lg border border-gray-200">
            {% if error %}
                <div class="p-3.5 mb-6 rounded-xl bg-red-50 border border-red-200 text-xs font-medium text-red-800 flex items-center gap-2">
                    <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="POST" action="/admin/login{% if next_url %}?next={{ next_url }}{% endif %}" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        value="{{ email or '' }}"
                        placeholder="admin@example.com"
                        class="w-full px-4 py-2.5 text-sm rounded-xl border border-gray-300 focus:border-homey-500 focus:ring-2 focus:ring-homey-500/20 outline-none transition-all"
                    >
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 text-sm rounded-xl border border-gray-300 focus:border-homey-500 focus:ring-2 focus:ring-homey-500/20 outline-none transition-all"
                    >
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn-dark w-full py-2.5 text-sm">
                        Sign In to Admin
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/" class="text-xs font-semibold text-gray-500 hover:text-gray-900 transition-colors">
                ← Back to Public Status Page
            </a>
        </div>
    </div>
</body>
</html>
