<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Console | {{ app_name }}{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              homey: {
                50: '#F0FDF4',
                100: '#DCFCE7',
                200: '#BBF7D0',
                300: '#86EFAC',
                400: '#4ADE80',
                500: '#00B86B',
                600: '#00A35E',
                700: '#00874E',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-full font-sans text-gray-900 bg-gray-50 antialiased">
    <!-- Admin Top Navbar -->
    <header class="bg-gray-950 text-white sticky top-0 z-40 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-6">
                    <a href="/admin" class="flex items-center gap-2.5 font-bold tracking-tight text-white">
                        <span class="w-3 h-3 rounded-full bg-homey-500"></span>
                        <span>{{ app_name }}</span>
                        <span class="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider bg-gray-800 text-gray-300 rounded">Admin</span>
                    </a>

                    <nav class="hidden md:flex items-center gap-1">
                        <a href="/admin" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors {% if active_admin_nav == 'dashboard' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white hover:bg-gray-900{% endif %}">
                            Dashboard
                        </a>
                        <a href="/admin/issues" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors {% if active_admin_nav == 'issues' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white hover:bg-gray-900{% endif %}">
                            Issues
                        </a>
                        <a href="/admin/issues/new" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors {% if active_admin_nav == 'new_issue' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white hover:bg-gray-900{% endif %}">
                            + New Issue
                        </a>
                        <a href="/admin/audit" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors {% if active_admin_nav == 'audit' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white hover:bg-gray-900{% endif %}">
                            Audit Trail
                        </a>
                    </nav>
                </div>

                <div class="flex items-center gap-4">
                    <a href="/" target="_blank" class="hidden sm:inline-flex items-center gap-1 text-xs text-gray-400 hover:text-gray-200">
                        <span>Public View</span>
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>

                    <div class="h-4 w-px bg-gray-800 hidden sm:block"></div>

                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-400 hidden sm:inline">{{ current_user.email }}</span>
                        <a href="/admin/logout" class="text-xs font-medium text-red-400 hover:text-red-300 transition-colors">
                            Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Admin Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
