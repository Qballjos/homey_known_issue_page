<header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-gray-200/80 transition-shadow">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20">
            <!-- Brand Logo & Name -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-homey-500/10 border border-homey-500/20 flex items-center justify-center text-homey-600 transition-transform group-hover:scale-105">
                    <!-- Generic Smart Home Icon -->
                    <svg class="w-5 h-5 text-homey-600" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <div>
                    <span class="text-base sm:text-lg font-bold text-gray-950 tracking-tight block leading-tight">{{ app_name }}</span>
                    <span class="text-xs font-medium text-gray-500">Known Issues & Status</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-1 sm:gap-2">
                <a href="/" class="px-3 py-2 text-sm font-semibold rounded-lg transition-colors {% if active_nav == 'issues' %}text-gray-950 bg-gray-100{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                    Known Issues
                </a>
                <a href="/resolved" class="px-3 py-2 text-sm font-semibold rounded-lg transition-colors {% if active_nav == 'resolved' %}text-gray-950 bg-gray-100{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                    Resolved Issues
                </a>
                
                <div class="h-4 w-px bg-gray-200 mx-1 hidden sm:block"></div>

                {% if current_user %}
                    <a href="/admin" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full bg-gray-900 text-white hover:bg-gray-800 transition-all">
                        <span class="w-1.5 h-1.5 rounded-full bg-homey-400"></span>
                        Admin Dashboard
                    </a>
                {% else %}
                    <a href="/admin/login" class="text-xs font-medium text-gray-400 hover:text-gray-700 px-2 py-1 transition-colors">
                        Staff Login
                    </a>
                {% endif %}
            </nav>
        </div>
    </div>
</header>
