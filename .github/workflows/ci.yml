name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v4 is latest; GitHub forces Node 24 automatically

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-only-12345"
          AUTO_SEED: "false"
        run: |
          PYTHONPATH=. pytest -v tests/

  docker:
    name: Build & Verify Docker Container
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: known-issues:test
          load: true

      - name: Verify Container Healthcheck
        run: |
          docker run -d --name test-container -p 8080:8000 \
            -e DATABASE_URL=sqlite:///./data/known_issues.db \
            -e SECRET_KEY=ci-test-key-for-container-verification \
            known-issues:test

          echo "Waiting for container to boot and pass /health..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health | grep -q "healthy"; then
              echo "Container health check passed!"
              docker stop test-container
              exit 0
            fi
            sleep 1
          done

          echo "Container failed to respond to /health in time"
          docker logs test-container
          docker stop test-container
          exit 1

  publish:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-24.04
    needs: [ test, docker ]
    # Only publish on pushes to main — not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homey-known-issues
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
